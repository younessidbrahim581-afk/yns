<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>youness Coffee</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f1e1;
      color: #4b2e00;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    header {
      background-color: #6f4e37;
      color: white;
      padding: 20px 0;
      margin-bottom: 30px;
    }
    h1 {
      margin: 0;
    }
    .coffee-image {
      max-width: 350px;
      border-radius: 40px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2em;
      line-height: 1.6em;
      max-width: 600px;
      margin: 0 auto 30px;
    }
    .btn-order {
      background-color: #a0522d;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-order:hover {
      background-color: #853d1b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to youness Coffee</h1>
  </header>
  <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80" alt="Cup of coffee" class="coffee-image" />
  <p>Enjoy the finest coffee blends carefully brewed to warm your soul. Fresh, aromatic, and made just for you.</p>
  <button class="btn-order" onclick="alert('Thank you for your order!')">click to buy</button>
</body>
</html>
